<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2340">
<title>Site Visit Log</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--steel:#E4E9ED;--steel-2:#D3DBE2;--paper:#FFF;--ink:#0E2340;--pen:#2B4FA8;--pen-soft:#8FA5D6;--mark:#E0A020;--line:#B9C5D0;--ok:#1E7A5A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--steel);background-image:linear-gradient(var(--steel-2) 1px,transparent 1px),linear-gradient(90deg,var(--steel-2) 1px,transparent 1px);background-size:26px 26px;
 color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

#gate{position:fixed;inset:0;z-index:60;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:360px;color:#fff}
.gate-mark{width:54px;height:54px;border:2px solid var(--pen-soft);position:relative;margin-bottom:22px}
.gate-mark:after{content:"";position:absolute;inset:9px;border:2px solid var(--mark);border-radius:50%}
.gate-card h1{font-size:27px;font-weight:600;margin:0 0 4px;letter-spacing:-.015em}
.gate-card p{margin:0 0 26px;color:var(--pen-soft);font-size:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--pen-soft);margin-bottom:5px}
.field input{width:100%;padding:12px 14px;background:transparent;border:1px solid #3A5480;color:#fff;border-radius:2px}
.btn-primary{width:100%;padding:13px;background:var(--mark);color:#231704;font-weight:600;border-radius:2px;margin-top:8px}
.gate-hint{margin-top:18px;font-size:12px;color:#6D85B4}
.err{color:#F0A090;font-size:13px;min-height:20px;margin-top:8px}

header.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header.top .name{font-weight:600;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .sub{display:block;font-size:11px;color:var(--pen-soft);font-weight:400}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid #34507E;border-radius:2px;color:#fff;flex:none}
.vlist{list-style:none;margin:12px 0 0;padding:0}
.vlist li{border-bottom:1px solid var(--line)}
.vlist button{width:100%;text-align:start;padding:11px 2px;display:flex;gap:10px;align-items:baseline}
.vlist .s{font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vlist .c{font-size:12px;color:#6B8199;display:block;font-weight:400}
.vlist .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--pen);flex:none}
.vlist li[aria-current="true"] .s{color:var(--pen)}
.searchrow{display:flex;gap:8px;margin-bottom:10px}
.searchrow input{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:2px}
.sortrow{display:flex;gap:6px}
.sortrow button{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:2px;font-size:12.5px}
.sortrow button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.geo{display:flex;gap:8px}.geo input{flex:1}
.geo button{flex:none;padding:0 12px;border:1px solid var(--line);border-radius:2px;background:#fff;font-size:12.5px}
.visitbar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#F7F9FB;border-bottom:1px solid var(--line);font-size:12.5px;color:#4A6180}
.visitbar b{color:var(--ink);font-weight:600}
.visitbar .meta{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visitbar button{padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:2px;font-size:12px;flex:none}
.visitbar button.prim{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.visitbar input{flex:1;min-width:90px;padding:6px 10px;border:1px solid var(--line);border-radius:2px;font-size:13px;background:#fff}
.save{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ok);flex:none}
.chip.add{border-style:dashed;color:var(--pen);font-weight:600}
.formrow{display:flex;gap:8px}.formrow>div{flex:1}
.itemform{background:#F7F9FB;border-bottom:1px solid var(--line);padding:12px 14px}
.itemform input,.itemform select{width:100%;padding:9px;border:1px solid var(--line);border-radius:2px;background:#fff;margin-bottom:8px}
.itemform label{font-size:11px;color:#6B8199}
.iconadd{width:30px;height:30px;border:1px solid var(--line);border-radius:2px;display:grid;place-items:center;font-size:17px;color:var(--pen);background:#fff}
.printhead{display:none}
@media print{.printhead{display:block;margin-bottom:14px;border-bottom:2px solid #0E2340;padding-bottom:8px}
 .printhead h1{font-size:19px;margin:0 0 4px}.printhead p{margin:0;font-size:12px;color:#333}
 .visitbar,.itemform{display:none!important}}
.projects{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);scrollbar-width:none}
.projects::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border:1px solid var(--line);border-radius:2px;white-space:nowrap;font-size:13px;color:#4A6180;background:#fff}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:0 0 96px}

.plan-wrap{background:var(--paper);border-bottom:1px solid var(--line);padding:12px 12px 10px}
.plan-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.plan-head h2{font-size:14px;font-weight:600;margin:0;flex:1}
.plan-head span{font-size:12px;color:#6B8199}
.modes{display:flex;gap:6px;margin-bottom:9px}
.modes button{flex:1;padding:8px;border:1px solid var(--line);border-radius:2px;font-size:13px;color:#4A6180;background:#fff}
.modes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}

.plan-box{position:relative;border:1px solid var(--line);background:#FBFCFD;overflow:hidden;min-height:240px;display:flex;align-items:center;justify-content:center}
.plan-box svg,.plan-box img{display:block;width:100%;height:auto;max-height:72vh}
.plan-box.drawing,.plan-box.drawing *{touch-action:none;-webkit-user-select:none;user-select:none}
.plan-box.drawing{box-shadow:inset 0 0 0 2px var(--pen)}
.plan-box.tool-line{cursor:crosshair}
.plan-box.tool-sel{cursor:default}
.plan-box.tool-place{cursor:copy}
.plan-box.editing{cursor:crosshair;box-shadow:inset 0 0 0 2px var(--mark)}
.pin{position:absolute;transform:translate(50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--pen);color:#fff;
 display:grid;place-items:center;font-size:13px;font-weight:600;border:2px solid #fff;box-shadow:0 1px 4px rgba(14,35,64,.4)}
.pin.on{background:var(--mark);color:#231704;transform:translate(50%,-50%) scale(1.25);z-index:5}
.dyn{position:absolute;z-index:6;display:none;align-items:center;gap:5px;background:#fff;border:1px solid var(--ink);
 border-radius:3px;padding:4px 5px;box-shadow:0 2px 8px rgba(14,35,64,.28);transform:translate(-50%,-150%)}
.dyn.show{display:flex}
.dyn input{width:76px;padding:6px 4px;border:1px solid var(--line);border-radius:2px;text-align:center;
 font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;color:var(--ink)}
.dyn.lock input{border-color:var(--mark);background:#FFF9EC}
.dyn .u{font-size:11px;color:#6B8199}
.dyn .ang{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--pen);min-width:30px;text-align:center}
.dyn button{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:2px;font-size:14px}
.dyn .ok{background:var(--ink);color:#fff;border-color:var(--ink)}
.hud{position:absolute;bottom:8px;inset-inline-start:8px;background:rgba(14,35,64,.92);color:#fff;font-family:"IBM Plex Mono",monospace;
 font-size:12px;padding:5px 9px;border-radius:2px;pointer-events:none;display:none}
.hud.show{display:block}
.plan-tools{display:flex;gap:8px;padding-top:9px;font-size:12px;color:#6B8199;align-items:center;flex-wrap:wrap}
.tool{padding:6px 10px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#231704;font-weight:600}

.draw-panel{border:1px solid var(--line);border-top:0;background:#F7F9FB;padding:11px 12px}
.tabs{display:flex;gap:6px;margin-bottom:11px}
.tabs button{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:2px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:#fff;font-weight:600}
.draw-row{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.draw-row label{font-size:12px;color:#6B8199;flex:none}
.len-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:2px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:230px;margin:0 auto}
.pad button{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:2px;font-size:19px;color:var(--pen);display:grid;place-items:center}
.pad button:active{background:var(--mark);color:#231704}
.pad .mid{border:0;background:transparent;font-size:11px;color:#6B8199;display:grid;place-items:center;text-align:center;line-height:1.25}
.draw-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.draw-acts button{flex:1 1 22%;padding:9px;border:1px solid var(--line);background:#fff;border-radius:2px;font-size:13px}
.draw-acts button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.readout{font-family:"IBM Plex Mono",monospace;font-size:12px;color:#4A6180;margin-top:9px;text-align:center}

.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.pal{border:1px solid var(--line);background:#fff;border-radius:2px;padding:6px 4px 5px;display:grid;gap:3px;justify-items:center}
.pal svg{width:100%;height:38px}
.pal span{font-size:11px;color:#4A6180;line-height:1.2;text-align:center}
.pal[aria-pressed="true"]{border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen);background:#F2F6FF}
.sizes{display:flex;gap:7px;margin:10px 0 0}
.sizes div{flex:1}
.sizes label{font-size:11px;color:#6B8199}
.sizes input{width:100%;padding:8px;border:1px solid var(--line);border-radius:2px;text-align:center;font-family:"IBM Plex Mono",monospace}
.sel-bar{margin-top:10px;padding:10px;border:1px solid var(--line);background:#fff;border-radius:2px}
.sel-bar h4{margin:0 0 8px;font-size:13px;font-weight:600}
.sel-bar select{width:100%;padding:8px;border:1px solid var(--line);border-radius:2px;background:#fff;margin-bottom:8px}
.hintbox{font-size:12px;color:#6B8199;text-align:center;padding:6px 0}

.list-head{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 8px}
.list-head h2{font-size:14px;margin:0;font-weight:600}
.list-head em{font-style:normal;font-size:12px;color:#6B8199}
.cards{display:flex;flex-direction:column;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.card{background:var(--paper);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;scroll-margin-top:120px;position:relative}
.card.on{background:#FFF9EC}
.card.on:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--mark)}
.num{flex:none;width:26px;height:26px;border:1.5px solid var(--pen);color:var(--pen);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;margin-top:2px}
.card.on .num{background:var(--mark);border-color:var(--mark);color:#231704}
.body{flex:1;min-width:0}
.body h3{margin:0 0 2px;font-size:14.5px;font-weight:600;line-height:1.4}
.body .en{font-size:12px;color:#6B8199;margin:0 0 6px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.dim{background:#EEF2F7;border:1px solid #DCE4EC;padding:2px 7px;border-radius:2px}
.qty{color:var(--ok);font-weight:600}
.thumb{flex:none;width:76px;height:66px;border:1px solid var(--line);background:#fff;padding:3px}
.thumb svg{width:100%;height:100%;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb{cursor:pointer}
.bigthumb{border:1px solid var(--line);background:#fff;padding:10px;height:170px;margin-bottom:14px}
.bigthumb svg,.bigthumb img{width:100%;height:100%;object-fit:contain;display:block}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-bottom:12px}
.icongrid button{border:1px solid var(--line);background:#fff;border-radius:2px;padding:4px;height:62px}
.icongrid button svg{width:100%;height:100%}
.icongrid button[aria-pressed="true"]{border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen);background:#F2F6FF}

#lightbox{position:fixed;inset:0;z-index:70;background:rgba(9,20,38,.94);display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:14px}
#lightbox.show{display:flex}
#lightbox .frame{background:#fff;padding:16px;max-width:420px;width:100%}
#lightbox .frame svg{width:100%;height:auto}
#lightbox p{color:#fff;margin:0;text-align:center;font-size:14px}
#panel,#visitPanel,#visitsPanel,#itemPanel{position:fixed;inset:0;z-index:65;background:rgba(9,20,38,.5);display:none}
#panel.show,#visitPanel.show,#visitsPanel.show,#itemPanel.show{display:block}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--paper);border-top:3px solid var(--ink);padding:18px 16px 28px;max-height:86vh;overflow:auto}
.sheet h2{margin:0 0 2px;font-size:17px}
.sheet .lede{margin:0 0 18px;font-size:13px;color:#6B8199}
.sheet .field label{color:#6B8199}
.sheet .field input{border:1px solid var(--line);color:var(--ink);border-radius:2px}
.sheet .btn-primary{background:var(--ink);color:#fff}
.users{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line)}
.users li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.users .role{color:#6B8199;font-size:12px}
.close-x{position:absolute;top:12px;inset-inline-start:14px;font-size:20px;color:#6B8199}
.actions{position:fixed;bottom:0;inset-inline:0;z-index:40;background:var(--paper);border-top:1px solid var(--line);
 padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.actions button{flex:1;padding:12px;border-radius:2px;font-weight:600;font-size:14px}
.act-main{background:var(--ink);color:#fff}
.act-ghost{border:1px solid var(--line);color:var(--ink)}
@media(min-width:760px){
 .wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr;align-items:start}
 .plan-wrap{position:sticky;top:56px;border-inline-start:1px solid var(--line)}
}
@media print{
 body{background:#fff}
 header.top,.projects,.actions,.plan-tools,.modes,.draw-panel,.hud,#panel,#lightbox,#gate{display:none!important}
 .plan-wrap{border:0;padding:0}.card{break-inside:avoid;border-bottom:1px solid #ccc}.wrap{display:block}
}
</style>
</head>
<body>

<div id="gate"><div class="gate-card">
  <div class="gate-mark"></div><h1 dir="ltr" style="text-align:start">Site Visit Log</h1>
  <p data-i18n="tagline"></p>
  <div class="field"><label for="u" data-i18n="email"></label><input id="u" type="email" autocomplete="email" inputmode="email"></div>
  <div class="field"><label for="p" data-i18n="pass"></label><input id="p" type="password" autocomplete="current-password"></div>
  <div class="err" id="gerr"></div>
  <button class="btn-primary" id="login" data-i18n="login"></button>
  <div class="gate-hint"><span id="modeHint"></span> · <a href="#" id="cfgLink" style="color:#8FA5D6" data-i18n="cloudSetup"></a></div>
  <div id="cfgBox" hidden style="margin-top:16px;border-top:1px solid #3A5480;padding-top:14px">
    <div class="field"><label data-i18n="sbUrl"></label><input id="sbUrl" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label data-i18n="sbKey"></label><input id="sbKey" placeholder="anon public key"></div>
    <button class="btn-primary" id="cfgSave" data-i18n="saveConnect"></button>
  </div>
</div></div>

<header class="top">
  <button class="icon-btn" id="openPanel">☰</button>
  <div class="name" id="pname">—<span class="sub" id="psub"></span></div>
  <button class="icon-btn" id="langBtn">ع</button>
  <button class="icon-btn" id="logout">⏻</button>
</header>
<div class="visitbar">
  <button id="newVisitTop" class="prim" data-i18n="newVisitShort"></button>
  <button id="openVisits"></button>
  <input id="quickSearch" data-i18n-ph="searchPh">
</div>
<div class="visitbar"><span class="meta" id="visitMeta"></span><span id="whoami" class="save" style="color:#6B8199"></span><span id="saveState" class="save"></span><button id="editVisit" data-i18n="editVisit"></button></div>

<main><div class="printhead" id="printHead"></div><div class="wrap">
 <section class="plan-wrap">
  <div class="plan-head"><h2 data-i18n="siteplan"></h2><span id="planScale"></span></div>
  <div class="modes">
    <button data-mode="draw" aria-pressed="true" data-i18n="mDraw"></button>
    <button data-mode="img" data-i18n="mUpload"></button>
  </div>
  <input id="upl" type="file" accept="image/*" hidden>

  <div class="plan-box" id="planBox"><div class="hud mono" id="hud"></div>
    <div class="dyn" id="dyn"><input id="clen" type="number" inputmode="numeric" step="10" min="10"><span class="u" data-i18n="mm"></span><span class="ang" id="cang"></span><button class="ok" id="cok" data-i18n-title="drawBtn">✓</button><button id="cfree" data-i18n-title="unlock">✕</button></div>
  </div>

  <div class="draw-panel" id="drawPanel" hidden>
    <div class="tabs">
      <button data-tool="line" aria-pressed="true" data-i18n="tLine"></button>
      <button data-tool="block" data-i18n="tBlock"></button>
      <button data-tool="sel" data-i18n="tSel"></button>
    </div>

    <div id="tabLine">
      <div class="tabs" style="margin-bottom:10px">
        <button data-kind="wall" aria-pressed="true" data-i18n="wallType"></button>
        <button data-kind="panel" data-i18n="panelType"></button>
      </div>
      <div class="draw-row">
        <label for="len" data-i18n="length"></label>
        <input class="len-input" id="len" type="number" inputmode="numeric" value="1200" min="10" step="10">
        <label data-i18n="mm"></label>
      </div>
      <div class="draw-row">
        <label for="wallT" data-i18n="wallT"></label>
        <input class="len-input" id="wallT" type="number" inputmode="numeric" value="100" min="20" step="10">
        <label data-i18n="mm"></label>
      </div>
      <div class="pad">
        <button data-a="135">↖</button><button data-a="90">↑</button><button data-a="45">↗</button>
        <button data-a="180">←</button><div class="mid" data-i18n="padHint"></div><button data-a="0">→</button>
        <button data-a="225">↙</button><button data-a="270">↓</button><button data-a="315">↘</button>
      </div>
      <div class="draw-acts">
        <button id="undo" data-i18n="undo"></button><button id="close" data-i18n="closeShape"></button>
        <button id="clear" data-i18n="clearLines"></button>
      </div>
    </div>

    <div id="tabBlock" hidden>
      <div class="palette" id="palette"></div>
      <div class="sizes">
        <div><label for="bw" data-i18n="widthMM"></label><input id="bw" type="number" step="10" value="1200"></div>
        <div><label for="bd" data-i18n="depthMM"></label><input id="bd" type="number" step="10" value="700"></div>
      </div>
      <div class="draw-acts" style="margin-top:10px"><button id="autoBlocks" data-i18n="autoBlocks"></button></div>
      <div class="hintbox" id="blockHint" data-i18n="blockHint"></div>
    </div>

    <div id="tabSel" hidden>
      <div id="selBox"></div>
    </div>

    <div class="draw-acts">
      <button id="pan" aria-pressed="false" data-i18n="panView"></button>
      <button id="zin">＋</button><button id="zout">－</button><button id="fit" data-i18n="fit"></button>
    </div>

const C=Math.cos(Math.PI/6), S=.5, SQ2=Math.SQRT2;
const P=(x,y,z)=>[(x-y)*C,(x+y)*S-z];
const f1=v=>(Math.round(v*10)/10);
const PL=(pts,close)=>`<path d="M${pts.map(p=>f1(p[0])+" "+f1(p[1])).join(" L")}${close?" Z":""}"/>`;
function bx(x,y,z,w,d,h){
  const A=(a,b,c)=>P(x+a,y+b,z+c);
  return PL([A(0,0,h),A(w,0,h),A(w,d,h),A(0,d,h)],1)
       + PL([A(0,d,h),A(w,d,h),A(w,d,0),A(0,d,0)],1)
       + PL([A(w,0,h),A(w,d,h),A(w,d,0),A(w,0,0)],1);
}
const ell=(cx,cy,z,r)=>{const p=P(cx,cy,z);
  return `<ellipse cx="${f1(p[0])}" cy="${f1(p[1])}" rx="${f1(r*SQ2*C)}" ry="${f1(r*SQ2*S)}"/>`};
const face=(pts,fill)=>`<path fill="${fill}" d="M${pts.map(p=>f1(p[0])+" "+f1(p[1])).join(" L")} Z"/>`;
const topRect=(x,y,z,w,d,fill)=>face([P(x,y,z),P(x+w,y,z),P(x+w,y+d,z),P(x,y+d,z)],fill);
function isoWrap(inner,W,D,H,Z0){
  Z0=Z0||0;
  const pad=Math.max(W,D,H)*.09, lw=Math.max(W,D,H)/150;
  const x1=-D*C-pad, x2=W*C+pad, y1=-H-pad, y2=(W+D)*S-Z0+pad;
  return `<svg viewBox="${f1(x1)} ${f1(y1)} ${f1(x2-x1)} ${f1(y2-y1)}" xmlns="${NS}">
    <g fill="#fff" stroke="#12294D" stroke-width="${f1(lw*1.15)}" stroke-linejoin="round" stroke-linecap="round">${inner}</g></svg>`;
}
function frame(w,d,levels,leg){
  leg=leg||50; let o="", z0=0;
  const cs=[[0,0],[w-leg,0],[0,d-leg],[w-leg,d-leg]];
  cs.forEach(c=>{o+=bx(c[0]+8,c[1]+8,-28,leg-16,leg-16,28)});
  levels.forEach(lv=>{
    cs.forEach(c=>{o+=bx(c[0],c[1],z0,leg,leg,lv.z-z0)});
    const m=lv.inset||0;
    o+=bx(m,m,lv.z,w-2*m,d-2*m,lv.t);
    if(lv.lip) o+=PL([P(m+40,m+40,lv.z+lv.t),P(w-m-40,m+40,lv.z+lv.t),
                      P(w-m-40,d-m-40,lv.z+lv.t),P(m+40,d-m-40,lv.z+lv.t)],1);
    z0=lv.z+lv.t;
  });

}

/* ================= هندسة الرسم ================= */
const SNAP_A=45,SNAP_L=10,MINL=10, rnd=v=>Math.round(v/SNAP_L)*SNAP_L;
function allPts(){
  const p=[...cur.draw.pts];
  cur.blocks.forEach(b=>{const c=corners(b);c.forEach(q=>p.push(q))});
  return p;
}
function corners(b){
  const r=b.rot*Math.PI/180, cs=Math.cos(r), sn=Math.sin(r);
  return [[0,0],[b.w,0],[b.w,b.d],[0,b.d]].map(([x,y])=>[b.x+x*cs-y*sn, b.y+x*sn+y*cs]);
}

/* ===== منع تراكب البلوك مع الجدار + المحاذاة التلقائية ===== */
function wallBands(){
  const d=cur.draw, WT=cur.wallT||100;
  const list=d.closed&&d.pts.length>2?[...d.pts,d.pts[0]]:d.pts, out=[];
  for(let i=0;i<list.length-1;i++){
    const [ax,ay]=list[i],[cx,cy]=list[i+1];
    if(Math.abs(ay-cy)<1&&Math.abs(ax-cx)>1)
      out.push({h:1,x1:Math.min(ax,cx)-WT/2,x2:Math.max(ax,cx)+WT/2,y1:ay-WT/2,y2:ay+WT/2});
    else if(Math.abs(ax-cx)<1&&Math.abs(ay-cy)>1)
      out.push({h:0,x1:ax-WT/2,x2:ax+WT/2,y1:Math.min(ay,cy)-WT/2,y2:Math.max(ay,cy)+WT/2});
  }
  return out;
}
function aabb(b){
  const c=corners(b);
  return {x1:Math.min(...c.map(p=>p[0])),x2:Math.max(...c.map(p=>p[0])),
          y1:Math.min(...c.map(p=>p[1])),y2:Math.max(...c.map(p=>p[1]))};
}
const INWALL=["door1","door2","window","coldH","coldS"];
function constrain(b){
  const bands=wallBands(); if(!bands.length) return;
  const tol=Math.max(180,(cur.wallT||100)*1.6);
  if(INWALL.includes(b.k)){            /* الأبواب والشبابيك تُركّب داخل الجدار */
    const r=aabb(b); const cx=(r.x1+r.x2)/2, cy=(r.y1+r.y2)/2;
    let best=null;
    for(const w of bands){
      const wcx=(w.x1+w.x2)/2, wcy=(w.y1+w.y2)/2;
      if(w.h){ if(cx<w.x1||cx>w.x2) continue; const g=Math.abs(cy-wcy);
        if(g<tol*3&&(!best||g<best.g)) best={g,ax:"y",mv:wcy-cy}; }
      else   { if(cy<w.y1||cy>w.y2) continue; const g=Math.abs(cx-wcx);
        if(g<tol*3&&(!best||g<best.g)) best={g,ax:"x",mv:wcx-cx}; }
    }
    if(best){ if(best.ax==="x") b.x=Math.round(b.x+best.mv); else b.y=Math.round(b.y+best.mv); }
    return;
  }
  for(let pass=0;pass<4;pass++){
    const r=aabb(b); let mv=0, ax=null;
    for(const w of bands){
      const ovX=Math.min(r.x2,w.x2)-Math.max(r.x1,w.x1);
      const ovY=Math.min(r.y2,w.y2)-Math.max(r.y1,w.y1);
      if(ovX<=0||ovY<=0) continue;              // لا تراكب
      if(w.h){ const up=w.y1-r.y2, dn=w.y2-r.y1, p=Math.abs(up)<Math.abs(dn)?up:dn;
        if(Math.abs(p)>Math.abs(mv)){mv=p;ax="y"} }
      else   { const lf=w.x1-r.x2, rt=w.x2-r.x1, p=Math.abs(lf)<Math.abs(rt)?lf:rt;
        if(Math.abs(p)>Math.abs(mv)){mv=p;ax="x"} }
    }
    if(!ax) break;
    if(ax==="x") b.x+=mv; else b.y+=mv;
  }
  /* محاذاة: لصق الوجه بالجدار إذا كان قريبًا */
  const r=aabb(b); let best=null;
  for(const w of bands){
    if(w.h){
      if(r.x2<w.x1||r.x1>w.x2) continue;
      const g1=w.y1-r.y2, g2=r.y1-w.y2;           // فوق / تحت الجدار
      if(g1>=0&&g1<tol&&(!best||g1<best.g)) best={g:g1,ax:"y",mv:g1};
      if(g2>=0&&g2<tol&&(!best||g2<best.g)) best={g:g2,ax:"y",mv:-g2};
    }else{
      if(r.y2<w.y1||r.y1>w.y2) continue;
      const g1=w.x1-r.x2, g2=r.x1-w.x2;
      if(g1>=0&&g1<tol&&(!best||g1<best.g)) best={g:g1,ax:"x",mv:g1};
      if(g2>=0&&g2<tol&&(!best||g2<best.g)) best={g:g2,ax:"x",mv:-g2};
    }
  }
  if(best){ if(best.ax==="x") b.x+=best.mv; else b.y+=best.mv; }
  b.x=Math.round(b.x); b.y=Math.round(b.y);
}
function extents(pts){
  if(!pts.length) return {x:-2000,y:-1500,w:4000,h:3000};
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  pts.forEach(p=>{a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1])});
  const w=Math.max(c-a,800),h=Math.max(d-b,600),pad=Math.max(w,h)*.14;
  return {x:a-pad,y:b-pad,w:w+pad*2,h:h+pad*2};
}

}

function blocksSVG(){

      stroke="${on?"#E0A020":"#0E2340"}" stroke-width="${on?3:2}" vector-effect="non-scaling-stroke" fill="none">
      ${B.f(b.w,b.d)}${on?`<rect x="-40" y="-40" width="${b.w+80}" height="${b.d+80}" fill="none" stroke="#E0A020" stroke-dasharray="${dash(b.w)}" stroke-width="2" vector-effect="non-scaling-stroke"/>`:""}</g>`;
    const r=b.rot*Math.PI/180, cx=b.x+(b.w/2)*Math.cos(r)-(b.d/2)*Math.sin(r), cy=b.y+(b.w/2)*Math.sin(r)+(b.d/2)*Math.cos(r);

      :`<text x="${cx}" y="${cy}" font-family="IBM Plex Mono,monospace" font-size="${fs*.62}" fill="#6B8199" text-anchor="middle" dominant-baseline="central" pointer-events="none">${b.w}×${b.d}</text>`;
    return g+tag;

}
function drawSVG(){
  const d=cur.draw; if(!cur.view) fitView();
  const v=cur.view, fs=v.w/38, r=v.w/130, gs=gridStep(v.w);
  let lab="",dots="",total=0;
  const WT=cur.wallT||100, ow=Math.max(v.w/300,3);
  const list=d.closed&&d.pts.length>2?[...d.pts,d.pts[0]]:d.pts;
  const dpath=d.pts.length>1?"M"+d.pts.map(q=>q[0]+" "+q[1]).join(" L")+(d.closed?" Z":""):"";
  const kinds=d.kinds||[]; let panels=0, joints="";
  for(let i=0;i<list.length-1;i++){
    const [ax,ay]=list[i],[bx2,by]=list[i+1],L=Math.hypot(bx2-ax,by-ay);
    if(kinds[i]!=="panel"||L<1) continue;
    panels+=Math.ceil(L/1000);
    const ux=(bx2-ax)/L, uy=(by-ay)/L, nx=-uy*WT/2, ny=ux*WT/2;
    for(let t=1000;t<L-1;t+=1000){
      const px=ax+ux*t, py=ay+uy*t;
      joints+=`<line x1="${px+nx}" y1="${py+ny}" x2="${px-nx}" y2="${py-ny}" stroke="#0E2340" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    }
    joints+=`<path d="M${ax+nx} ${ay+ny} L${bx2+nx} ${by+ny} M${ax-nx} ${ay-ny} L${bx2-nx} ${by-ny}" fill="none" stroke="#2B4FA8" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  }
  const seg=dpath?`<path d="${dpath}" fill="none" stroke="#0E2340" stroke-width="${WT}" stroke-linejoin="miter" stroke-linecap="butt"/>
    <path d="${dpath}" fill="none" stroke="#EAF0F6" stroke-width="${Math.max(WT-2*ow,WT*.2)}" stroke-linejoin="miter" stroke-linecap="butt"/>
    ${joints}
    <path d="${dpath}" fill="none" stroke="#8FA5D6" stroke-width="1" stroke-dasharray="14 10" vector-effect="non-scaling-stroke"/>`:"";
  for(let i=0;i<list.length-1;i++){
    const [ax,ay]=list[i],[bx2,by]=list[i+1],dx=bx2-ax,dy=by-ay,L=Math.round(Math.hypot(dx,dy));total+=L;
    const a=Math.atan2(dy,dx);let deg=a*180/Math.PI;
    const off=fs*.8+WT*.6,mx=(ax+bx2)/2-Math.sin(a)*off,my=(ay+by)/2+Math.cos(a)*off;
    if(deg>90||deg<-90)deg+=180;
    lab+=`<text x="${mx}" y="${my}" font-family="IBM Plex Mono,monospace" font-size="${fs}" fill="#2B4FA8" text-anchor="middle" dominant-baseline="middle" transform="rotate(${deg} ${mx} ${my})">${L}</text>`;
  }
  d.pts.forEach((p,i)=>{const last=i===d.pts.length-1&&!d.closed;
    dots+=`<circle cx="${p[0]}" cy="${p[1]}" r="${last?r*1.6:r}" fill="${last?"#E0A020":"#2B4FA8"}"/>`});
  const empty=!d.pts.length&&!cur.blocks.length;
  const hint=empty?`<text x="${v.x+v.w/2}" y="${v.y+v.h/2}" text-anchor="middle" font-family="IBM Plex Sans Arabic" font-size="${fs}" fill="#8FA5D6">${T("emptyHint")}</text>`:"";
  $("readout").textContent = T("readout",Math.max(0,list.length-1),cur.blocks.length,(total/1000).toFixed(2),gs,panels?T("panelsN",panels):T("gridN",gs));
  return `<svg viewBox="${v.x} ${v.y} ${v.w} ${v.h}" xmlns="${NS}" preserveAspectRatio="xMidYMid meet" style="aspect-ratio:${v.w}/${v.h}">
   <defs><pattern id="g" width="${gs}" height="${gs}" patternUnits="userSpaceOnUse">
     <path d="M${gs} 0H0V${gs}" fill="none" stroke="#DCE4EC" stroke-width="1" vector-effect="non-scaling-stroke"/></pattern></defs>
   <rect x="${v.x}" y="${v.y}" width="${v.w}" height="${v.h}" fill="#FBFCFD"/>
   <rect x="${v.x}" y="${v.y}" width="${v.w}" height="${v.h}" fill="url(#g)"/>
   ${hint}${seg}${blocksSVG()}${lab}${dots}<g id="ghost" pointer-events="none"></g></svg>`;
}
function toMM(svg,cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}
function snap(x,y){
  const d=cur.draw, tol=cur.view.w*.05, pts=lenLock&&d.pts.length?[]:allPts();
  for(const p of pts){
    if(Math.hypot(p[0]-x,p[1]-y)<tol){
      const l=d.pts.length?d.pts[d.pts.length-1]:null;
      return {x:p[0],y:p[1],end:true,L:l?Math.round(Math.hypot(p[0]-l[0],p[1]-l[1])):0};
    }}
  if(!d.pts.length) return {x:rnd(x),y:rnd(y)};
  const [px,py]=d.pts[d.pts.length-1];
  const deg=Math.round(Math.atan2(y-py,x-px)*180/Math.PI/SNAP_A)*SNAP_A, r=deg*Math.PI/180;
  const L=lenLock?Math.max(MINL,+$("clen").value||0):Math.max(0,rnd(Math.hypot(x-px,y-py)));

function ghost(sn){
  const g=$("planBox").querySelector("#ghost"); if(!g) return;
  const v=cur.view,fs=v.w/38,d=cur.draw;
  let s=`<line x1="${sn.x}" y1="${v.y}" x2="${sn.x}" y2="${v.y+v.h}" stroke="#8FA5D6" stroke-width="1" stroke-dasharray="6 6" vector-effect="non-scaling-stroke"/>
         <line x1="${v.x}" y1="${sn.y}" x2="${v.x+v.w}" y2="${sn.y}" stroke="#8FA5D6" stroke-width="1" stroke-dasharray="6 6" vector-effect="non-scaling-stroke"/>`;
  if(tool==="line"&&d.pts.length&&!d.closed){
    const [px,py]=d.pts[d.pts.length-1];
    s+=`<line x1="${px}" y1="${py}" x2="${sn.x}" y2="${sn.y}" stroke="#E0A020" stroke-width="3" stroke-dasharray="10 8" vector-effect="non-scaling-stroke"/>`;
    if(sn.L>0){const a=Math.atan2(sn.y-py,sn.x-px);let deg=a*180/Math.PI;
      const off=fs*.8,mx=(px+sn.x)/2-Math.sin(a)*off,my=(py+sn.y)/2+Math.cos(a)*off;
      if(deg>90||deg<-90)deg+=180;
      s+=`<text x="${mx}" y="${my}" font-family="IBM Plex Mono,monospace" font-size="${fs}" fill="#B37C0C" text-anchor="middle" dominant-baseline="middle" transform="rotate(${deg} ${mx} ${my})">${Math.round(sn.L)}</text>`}
  }
  if(tool==="place"&&pending){const w=+$("bw").value||BLK[pending].w, h=+$("bd").value||BLK[pending].d;
    s+=`<rect x="${sn.x-w/2}" y="${sn.y-h/2}" width="${w}" height="${h}" fill="none" stroke="#E0A020" stroke-width="2" stroke-dasharray="${dash(w)}" vector-effect="non-scaling-stroke"/>`}
  if(sn.end) s+=`<rect x="${sn.x-v.w/70}" y="${sn.y-v.w/70}" width="${v.w/35}" height="${v.w/35}" fill="none" stroke="#1E7A5A" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  g.innerHTML=s;
  const ang=sn.deg!==undefined?((-sn.deg%360)+360)%360:null;
  $("hud").className="hud mono show";
  $("hud").textContent = sn.L!==undefined&&tool==="line"?`${Math.round(sn.L)} مم   ${ang===null?"":ang+"°"}`:`${Math.round(sn.x)} , ${Math.round(sn.y)}`;
}
function clearGhost(){const g=$("planBox").querySelector("#ghost");if(g)g.innerHTML="";$("hud").className="hud mono"}
function commit(sn){
  const d=cur.draw; d.kinds=d.kinds||[];
  if(!d.pts.length){d.pts.push([rnd(sn.x),rnd(sn.y)])}
  else if(sn.end&&d.pts.length>2&&sn.x===d.pts[0][0]&&sn.y===d.pts[0][1]){d.closed=true;d.kinds[d.pts.length-1]=lineKind}
  else{if(!sn.L||sn.L<MINL)return; d.kinds[d.pts.length-1]=lineKind; d.pts.push([Math.round(sn.x),Math.round(sn.y)])}

}
function addByPad(deg){
  const d=cur.draw; if(d.closed)return;

const TYPE2BLK={table:"table",table2:"tableos",sink:"sink2",shelf:"wshelf",pshelf:"pshelf",

function dimsOf(it,k){
  const n=(it.dim.match(/\d+/g)||[]).map(Number);

function chipUpdate(live){
  const d=cur.draw, dyn=$("dyn");
  const on = cur.mode==="draw" && tool==="line" && !editing && !panMode && d.pts.length && !d.closed;
  dyn.classList.toggle("show",!!on); if(!on) return;

  try{
    const svg=$("planBox").querySelector("svg"); if(!svg) return;
    const p=svg.createSVGPoint(), t=d.pts[d.pts.length-1];
    p.x=t[0]; p.y=t[1];
    const q=p.matrixTransform(svg.getScreenCTM()), r=$("planBox").getBoundingClientRect();
    dyn.style.left=(q.x-r.left)+"px"; dyn.style.top=(q.y-r.top)+"px";
  }catch(e){}
}

let lastDeg=0,lastPos=null,panStart=null,lastAct=0,drag=null,lenLock=false;
const box=$("planBox");
function pos(e){const svg=box.querySelector("svg");if(!svg)return null;
  const q=toMM(svg,e.clientX,e.clientY);return {x:q.x,y:q.y,svg}}
function act(e){
  if(cur.mode!=="draw"||editing||panMode) return;
  const q=pos(e)||lastPos; if(!q) return;
  if(tool==="place"&&pending){placeBlock(q.x,q.y);lastAct=Date.now();return}
  if(tool==="line"){commit(snap(q.x,q.y));lastAct=Date.now();return}
  if(tool==="sel"){const t=e.target.closest?e.target.closest("[data-block]"):null;
    selBlock=t?+t.dataset.block:null;
    const b=cur.blocks.find(x=>x.id===selBlock);
    if(b&&b.item) sel=b.item, renderCards();
    renderSelBar(); renderPlan(); lastAct=Date.now();}
}
box.addEventListener("pointerdown",e=>{
  if(cur.mode!=="draw"||editing) return;
  const q=pos(e); if(!q) return;
  if(panMode){panStart=[q.x,q.y,cur.view.x,cur.view.y];return}
  const t=e.target.closest?e.target.closest("[data-block]"):null;
  if(tool==="sel"&&t){const b=cur.blocks.find(x=>x.id===+t.dataset.block);
    if(b){selBlock=b.id;drag={b,dx:q.x-b.x,dy:q.y-b.y,moved:false};renderSelBar();renderPlan()}}
});
box.addEventListener("pointermove",e=>{
  if(cur.mode!=="draw"||editing) return;
  const q=pos(e); if(!q) return; lastPos=q;
  if(panMode&&panStart){
    if(e.buttons===0&&e.pointerType==="mouse") return;
    cur.view.x=panStart[2]-(q.x-panStart[0]); cur.view.y=panStart[3]-(q.y-panStart[1]);
    autoFit=false; q.svg.setAttribute("viewBox",`${cur.view.x} ${cur.view.y} ${cur.view.w} ${cur.view.h}`); return;
  }
  if(drag){
    drag.b.x=rnd(q.x-drag.dx); drag.b.y=rnd(q.y-drag.dy); drag.moved=true;
    constrain(drag.b);
    const g=box.querySelector(`[data-block="${drag.b.id}"]`);
    if(g) g.setAttribute("transform",`translate(${drag.b.x},${drag.b.y}) rotate(${drag.b.rot})`);
    return;
  }
  const s=snap(q.x,q.y); if(s.deg!==undefined)lastDeg=((-s.deg%360)+360)%360; ghost(s); chipUpdate(s.L);
});

  navigator.geolocation.getCurrentPosition(
    pos=>{$("vLoc").value=pos.coords.latitude.toFixed(5)+", "+pos.coords.longitude.toFixed(5);$("verr").textContent=""},
    ()=>{$("verr").textContent=T("gpsFail")},{enableHighAccuracy:true,timeout:8000});
};
function renderPlan(){
  const hud=$("hud"), dyn=$("dyn");
  if(cur.mode==="img"&&!cur.img) cur.mode="draw";
  box.innerHTML = cur.mode==="img"?`<img src="${cur.img}" alt="${pn(cur)}">`:drawSVG();
  box.appendChild(hud); box.appendChild(dyn);
  if(cur.mode!=="draw"||editing) cur.items.forEach(it=>{
    const pin=document.createElement("button");
    pin.className="pin"+(sel===it.no?" on":"");pin.textContent=it.no;
    pin.style.right=(it.x==null?50:it.x)+"%";pin.style.top=(it.y==null?50:it.y)+"%";
    pin.onclick=e=>{e.stopPropagation();select(it.no,"pin")};
    box.appendChild(pin)});
  box.classList.toggle("drawing",cur.mode==="draw"&&!editing);
  box.classList.toggle("tool-line",cur.mode==="draw"&&tool==="line"&&!panMode);
  box.classList.toggle("tool-place",cur.mode==="draw"&&tool==="place");
  box.classList.toggle("tool-sel",cur.mode==="draw"&&tool==="sel");
  box.classList.toggle("editing",editing);
  $("drawPanel").hidden=cur.mode!=="draw";
  if(document.activeElement!==$("wallT")) $("wallT").value=cur.wallT||100;
  document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===cur.mode));
  $("planScale").textContent=cur.mode==="draw"?T("viewW",Math.round(cur.view?cur.view.w:0)):cur.scale.replace("__SURVEY__",T("surveying"));
  chipUpdate();
}
function renderCards(){
  $("cards").innerHTML="";
  cur.items.forEach(it=>{
    const c=document.createElement("div");
    c.className="card"+(sel===it.no?" on":"");c.id="card-"+it.no;
    c.innerHTML=`<div class="num">${it.no}</div><div class="body"><h3>${lang==="ar"?it.ar:it.en}</h3><p class="en">${lang==="ar"?it.en:it.ar}</p>
      <div class="meta"><span class="dim mono">${it.dim}</span><span class="qty">${qty(it.qty)}</span></div></div>
      <div class="thumb" role="button" tabindex="0">${thumbOf(it)}</div>`;
    c.onclick=e=>{if(e.target.closest(".thumb")){openItem(it.no);return}select(it.no,"card")};
    $("cards").appendChild(c)});
  $("count").textContent=T("itemsN",cur.items.length);
}
function select(no,from){
  sel=sel===no?null:no; renderPlan(); renderCards();
  if(sel&&from==="pin"){const el=$("card-"+sel);if(el)el.scrollIntoView({behavior:"smooth",block:"center"})}
  if(sel&&from==="card")box.scrollIntoView({behavior:"smooth",block:"nearest"});
  if(editing)$("editHint").textContent=sel?T("tapMove",sel):T("pickItem");
}
/* ================= تحرير البند والمصغّرة ================= */
let editItemNo=null, pendingThumb=null, pendingType=null;
function itemPreview(){
  $("itemPreview").innerHTML = pendingThumb?img(pendingThumb):sketch(pendingType);
}
function renderIconGrid(){
  $("iconGrid").innerHTML="";
  ITEM_TYPES.forEach(t=>{
    const b=document.createElement("button");
    b.title=lang==="ar"?t[2]:t[1];
    b.setAttribute("aria-pressed",!pendingThumb&&pendingType===t[0]);
    b.innerHTML=sketch(t[0]);
    b.onclick=()=>{pendingType=t[0];pendingThumb=null;itemPreview();renderIconGrid()};
    $("iconGrid").appendChild(b);
  });
}
function openItem(no){
  const it=cur.items.find(i=>i.no===no); if(!it) return;
  editItemNo=no; pendingThumb=it.thumb||null; pendingType=it.type||"table";
  $("iName").value=lang==="ar"?it.ar:it.en; $("iDim").value=it.dim||""; $("iQty").value=it.qty||1;
  itemPreview(); renderIconGrid();
  $("itemPanel").classList.add("show");
}
$("itemPreview").onclick=()=>{const it=cur.items.find(i=>i.no===editItemNo);if(it)lightbox({...it,thumb:pendingThumb,type:pendingType})};
$("closeItem").onclick=()=>$("itemPanel").classList.remove("show");
$("itemPanel").onclick=e=>{if(e.target.id==="itemPanel")$("itemPanel").classList.remove("show")};
function shrink(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const M=480, sc=Math.min(1,M/Math.max(im.width,im.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
      const g=cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,cv.width,cv.height);
      g.drawImage(im,0,0,cv.width,cv.height);
      cb(cv.toDataURL("image/jpeg",.75));
    };
    im.onerror=()=>cb(rd.result);
    im.src=rd.result;
  };
  rd.readAsDataURL(file);
}
async function loadTypeThumbs(){
  if(CLOUD){
    const {data}=await sb.from("type_thumbs").select("*");
    typeThumbs={}; (data||[]).forEach(r=>{if(r.image) typeThumbs[r.type]=r.image});
  }else{
    try{typeThumbs=JSON.parse(localStorage.getItem("svl.thumbs")||"{}")}catch(e){typeThumbs={}}
  }
}
async function setTypeThumb(type,image){
  if(image) typeThumbs[type]=image; else delete typeThumbs[type];
  if(CLOUD){
    if(image) await sb.from("type_thumbs").upsert({type,image,updated_by:me.id,updated_at:new Date().toISOString()});
    else await sb.from("type_thumbs").delete().eq("type",type);
  }else{
    try{localStorage.setItem("svl.thumbs",JSON.stringify(typeThumbs))}catch(e){}
  }
  isoCache[type]=isoCache[type];
  itemPreview(); renderIconGrid(); renderCards();
  $("ierr").textContent=T("typeSaved"); setTimeout(()=>{$("ierr").textContent=""},2500);
}
$("iTypeUp").onclick=()=>$("iTypeFile").click();
$("iTypeFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  shrink(f,d=>setTypeThumb(pendingType,d)); e.target.value="";
});
$("iTypeReset").onclick=()=>setTypeThumb(pendingType,null);
$("iPhoto").onclick=()=>$("iFile").click();
$("iNoPhoto").onclick=()=>{pendingThumb=null;itemPreview();renderIconGrid()};
$("iFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  shrink(f,d=>{pendingThumb=d;itemPreview();renderIconGrid()}); e.target.value="";
});
$("iSave").onclick=()=>{
  const it=cur.items.find(i=>i.no===editItemNo); if(!it) return;
  const n=$("iName").value.trim();
  if(n){ if(lang==="ar"){it.ar=n; if(!it.en)it.en=n} else {it.en=n; if(!it.ar)it.ar=n} }
  it.dim=$("iDim").value.trim()||"—";
  it.qty=Math.max(1,+$("iQty").value||1);
  it.type=pendingType; it.thumb=pendingThumb||null;
  $("itemPanel").classList.remove("show");
  renderCards(); renderSelBar(); saveStore();
};
$("iDel").onclick=()=>{
  cur.items=cur.items.filter(i=>i.no!==editItemNo);
  cur.blocks.forEach(b=>{if(b.item===editItemNo)b.item=null});
  $("itemPanel").classList.remove("show");
  renderCards(); renderPlan(); saveStore();
};
function lightbox(it){
  $("lbFrame").innerHTML=it.thumb?`<img src="${it.thumb}" style="width:100%">`:(typeThumbs[it.type]?`<img src="${typeThumbs[it.type]}" style="width:100%">`:drawing(it.type));
  $("lbCap").textContent=T("lbCap",it.no,lang==="ar"?it.ar:it.en,it.dim);
  $("lightbox").classList.add("show");
}
$("lightbox").onclick=()=>$("lightbox").classList.remove("show");
$("editPins").onclick=()=>{editing=!editing;$("editPins").setAttribute("aria-pressed",editing);
  $("editHint").textContent=editing?(sel?T("tapMove",sel):T("pickItem")):"";renderPlan()};
$("resetPins").onclick=()=>{cur.items.forEach(i=>{const h=home[cur.id+i.no];if(h){i.x=h[0];i.y=h[1]}});renderPlan()};
$("exportPdf").onclick=()=>window.print();
$("openPanel").onclick=()=>$("panel").classList.add("show");
$("closePanel").onclick=()=>$("panel").classList.remove("show");
$("panel").onclick=e=>{if(e.target.id==="panel")$("panel").classList.remove("show")};
function renderUsers(){
  $("users").innerHTML="";
  users.forEach(u=>{const li=document.createElement("li");
    li.innerHTML=`<span>${u.full_name||u.email||""}</span><span class="role">${L[lang][u.role]||u.role||""}</span>`;
    $("users").appendChild(li)});
}
$("addUser").onclick=async()=>{
  if(!CLOUD||!me||me.role!=="admin"){$("uerr").textContent=T("adminOnly");return}
  const full_name=$("nn").value.trim(), email=$("nu").value.trim(), password=$("np").value.trim(), role=$("nr").value;
  if(!email||!password){$("uerr").textContent=T("needUserPass");return}
  $("uerr").textContent="";
  try{
    const {data:{session}}=await sb.auth.getSession();
    const res=await fetch("/api/create-user",{method:"POST",
      headers:{"Content-Type":"application/json",Authorization:"Bearer "+(session&&session.access_token)},
      body:JSON.stringify({email,password,full_name,role})});
    const out=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(out.error||"failed");
    $("nn").value="";$("nu").value="";$("np").value="";
    $("uerr").style.color="var(--ok)";$("uerr").textContent=T("userAdded");
    await loadUsers(); renderUsers();
  }catch(e){$("uerr").style.color="";$("uerr").textContent=e.message}
};
/* ================= الحفظ: Supabase أو الجهاز ================= */
const KEY="svl.v1"; let savingNow=false, dirty=false;
const touch=()=>{dirty=true};
const saveState=t=>{$("saveState").textContent=t};
const uuid=()=>(crypto&&crypto.randomUUID)?crypto.randomUUID()
  :"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==="x"?r:(r&3|8)).toString(16)});
function pruneEmpty(){
  projects=projects.filter(v=>v.id===cur.id||v.client||v.site||v.items.length||v.blocks.length||v.draw.pts.length);
}
const isBlank=v=>!v.client&&!v.site&&!v.items.length&&!v.blocks.length&&!v.draw.pts.length;
function rowToVisit(r){const d=r.data||{};
  return {id:r.id,client:r.client||"",site:r.site||"",city:r.city||"",date:r.visit_date||"",loc:r.loc||"",
    notes:r.notes||"",owner:r.owner,author:r.author_name||"",wallT:r.wall_t||100,scale:"",
    mode:d.mode||"draw",img:d.img||null,view:d.view||null,
    draw:d.draw||{pts:[],closed:false,kinds:[]},blocks:d.blocks||[],items:d.items||[]}}
const visitToRow=v=>({id:v.id,owner:v.owner||me.id,author_name:v.author||me.name,
  client:v.client,site:v.site,city:v.city,visit_date:v.date||null,loc:v.loc,notes:v.notes,wall_t:v.wallT||100,
  data:{mode:v.mode,img:v.img,view:v.view,draw:v.draw,blocks:v.blocks,items:v.items},updated_at:new Date().toISOString()});
async function loadVisits(){
  const {data,error}=await sb.from("visits").select("*").order("visit_date",{ascending:false});
  if(error){saveState(T("offline"));return}
  projects=(data||[]).map(rowToVisit);
  bid=projects.reduce((m,v)=>Math.max(m,...v.blocks.map(b=>b.id),0),0)+1;
}
async function loadUsers(){const {data}=await sb.from("profiles").select("*").order("full_name");users=data||[]}
function loadLocal(){
  try{const d=JSON.parse(localStorage.getItem(KEY)||"null");
    if(d&&Array.isArray(d.projects)){projects=d.projects.map(v=>({wallT:100,mode:"draw",img:null,view:null,
      items:[],blocks:[],draw:{pts:[],closed:false,kinds:[]},...v}));
      bid=projects.reduce((m,v)=>Math.max(m,...v.blocks.map(b=>b.id),0),0)+1}
  }catch(e){}
}
async function saveStore(){
  if(!me||!cur) return;
  pruneEmpty();
  if(isBlank(cur)) return;
  if(!CLOUD){
    try{localStorage.setItem(KEY,JSON.stringify({projects,ts:Date.now()}));
      const d=new Date();saveState(T("savedAt",d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")));
    }catch(e){saveState(T("notSaved"))}
    return;
  }
  if(savingNow) return; savingNow=true; saveState(T("savingV"));
  const {error}=await sb.from("visits").upsert(visitToRow(cur));
  savingNow=false;
  if(error){saveState(T("offline"));return}
  cur.owner=cur.owner||me.id; cur.author=cur.author||me.name; dirty=false;
  const d=new Date(); saveState(T("savedAt",d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")));
  renderVisits();
}
function newDraft(){
  const v={id:uuid(),client:"",site:"",city:"",date:new Date().toISOString().slice(0,10),loc:"",notes:"",
    owner:me?me.id:null,author:me?me.name:"",scale:"",mode:"draw",img:null,wallT:100,
    draw:{pts:[],closed:false,kinds:[]},blocks:[],view:null,items:[]};
  projects.push(v); cur=v; sel=null; selBlock=null; return v;
}
let newVisitMode=false;
function openVisit(mode){
  const isNew = mode===true;                 /* نموذج فارغ ينشئ سجلًا جديدًا */
  newVisitMode = isNew;                      /* mode==="draft" يحرّر الزيارة الجديدة الحالية */
  $("visitTitle").textContent=T(mode?"newVisitTitle":"editVisitTitle");
  $("vClient").value=isNew?"":(cur.client||"");
  $("vSite").value=isNew?"":(cur.site||"");
  $("vCity").value=isNew?"":(cur.city||"");
  $("vDate").value=isNew?new Date().toISOString().slice(0,10):(cur.date||"");
  $("vLoc").value=isNew?"":(cur.loc||"");
  $("vNotes").value=isNew?"":(cur.notes||"");
  $("verr").textContent="";
  $("visitPanel").classList.add("show");
}
$("editVisit").onclick=()=>openVisit(false);
$("closeVisit").onclick=()=>$("visitPanel").classList.remove("show");
$("visitPanel").onclick=e=>{if(e.target.id==="visitPanel")$("visitPanel").classList.remove("show")};
$("vSave").onclick=()=>{
  const c=$("vClient").value.trim(), st=$("vSite").value.trim();
  if(!c||!st){$("verr").textContent=T("needSite");return}
  const data={client:c,site:st,city:$("vCity").value.trim(),date:$("vDate").value,loc:$("vLoc").value.trim(),notes:$("vNotes").value.trim()};
  if(newVisitMode){
    const v={id:"v"+Date.now(),...data,scale:"",mode:"draw",img:null,wallT:100,
      draw:{pts:[],closed:false,kinds:[]},blocks:[],view:null,items:[]};
    projects.push(v); cur=v; sel=null; selBlock=null;
  }else Object.assign(cur,data);
  $("visitPanel").classList.remove("show"); render(); saveStore();
};

/* ===== إضافة بند إلى الجدول ===== */
const ITEM_TYPES=[["table","Work table","طاولة عمل"],["table2","Table w/ overshelf","طاولة برف علوي"],
 ["sink","Sink","حوض"],["shelf","Wall shelf","رف جداري"],["pshelf","Perforated shelf","رف مثقّب"],
 ["cabinet","Cabinet","كابينة"],["hood","Hood","هود"],["burner","Burner","موقد"],["grill","Grill","شواية"],
 ["faucet","Faucet","خلاط"]];
function fillTypes(){
  $("fType").innerHTML=ITEM_TYPES.map(t=>`<option value="${t[0]}">${lang==="ar"?t[2]:t[1]}</option>`).join("");
}
$("addItemBtn").onclick=()=>{$("itemForm").hidden=!$("itemForm").hidden;if(!$("itemForm").hidden)$("fName").focus()};
$("fSave").onclick=()=>{
  const n=$("fName").value.trim(); if(!n) return $("fName").focus();
  const no=cur.items.reduce((m,i)=>Math.max(m,i.no),0)+1;
  cur.items.push({no,ar:n,en:n,dim:$("fDim").value.trim()||"—",qty:Math.max(1,+$("fQty").value||1),type:$("fType").value});
  $("fName").value="";$("fDim").value="";$("fQty").value=1;$("itemForm").hidden=true;
  renderCards(); renderSelBar();
};

function visitLine(p){return [p.client,p.city,p.date].filter(Boolean).join("  ·  ")}
function render(){$("whoami").textContent=me?me.name:"";
  $("pname").firstChild.textContent=pn(cur);$("psub").textContent=visitLine(cur);
  const mu=mapURL(cur);
  $("visitMeta").innerHTML=`<b>${cur.client||"—"}</b>  ·  ${cur.city||"—"}  ·  ${cur.date||"—"}`
    +(mu?`  ·  <a href="${mu}" target="_blank" rel="noopener" style="color:var(--pen)">${T("openMap")}</a>`:"")
    +(cur.notes?"  ·  "+cur.notes:"");
  renderVisits();
  $("printHead").innerHTML=`<h1>${pn(cur)}</h1><p>${T("clientL")}: ${cur.client||"—"} — ${T("cityL")}: ${cur.city||"—"} — ${T("dateL")}: ${cur.date||"—"}${cur.loc?" — "+T("locL")+": "+cur.loc:""}${cur.notes?" — "+cur.notes:""}<br>${T("surveyedBy")}: ${cur.author||(me?me.name:"—")}</p>`;
  renderPalette();renderSelBar();renderPlan();renderCards();renderUsers()}
$("clen").value=$("len").value;
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";applyLang()};
newDraft();
applyLang();
$("modeHint").textContent=CLOUD?T("cloudOn"):T("cloudOff");
setInterval(()=>{if(me)saveStore()},30000);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&me)saveStore()});
window.addEventListener("beforeunload",()=>{if(me)saveStore()});
["click","input","change"].forEach(t=>document.addEventListener(t,touch,true));
if(CLOUD) sb.auth.getSession().then(({data})=>{if(data&&data.session)afterAuth(data.session.user)});
</script>
